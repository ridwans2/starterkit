# Local deviation: MySQL Innovation 26.
#
# This file is deliberately NOT an edit to `docker-compose.yml`. Compose loads
# `docker-compose.override.yml` automatically and merges it per-service, so the
# result is identical — but `docker-compose.yml` is inside
# `KitUpdate::CAMINHOS_DO_KIT`: changing it means every `kit:update` offers
# `image: mysql:8.0` again, and this change disappears if that diff is accepted
# raw. A new file here is not in the upstream tree, so it never
# enters that diff.
services:
  mysql:
    image: mysql:26
